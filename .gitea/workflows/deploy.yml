---
name: Deploy Starship configuration

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qualify-push:
    name: Qualify Starship configuration change
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        run: |
          changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if [ "$changed_files" = starship.toml ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  deployment-request:
    name: Request central deployment
    runs-on: ubuntu-latest
    needs: qualify-push
    if: >-
      github.event_name == 'workflow_dispatch' || needs.qualify-push.outputs.deploy == 'true'
    steps:
      - name: Dispatch the approved Starship target
        env:
          CONTROL_REPOSITORY_WORKFLOW_TOKEN: ${{ secrets.CONTROL_REPOSITORY_WORKFLOW_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: token $CONTROL_REPOSITORY_WORKFLOW_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main","inputs":{"target":"starship","repository":"bigboss/starship"}}' \
            https://gitea.sooper.duckdns.org/api/v1/repos/bigboss/ansible-automation-infra/actions/workflows/deploy.yml/dispatches
