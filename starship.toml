# Get editor completions based on the config schema
'$schema' = 'https://starship.rs/config-schema.json'

# Move the directory to the second line
format = "$env_var$all$directory$shell$status$character"
add_newline = false
palette = 'gruvbox-dark'
command_timeout = 3600000

[palettes.gruvbox-dark]
bg0 = '#1d2021'
bg1 = '#282828'
fg0 = '#ebdbb2'
red = '#ea6969'
orange = '#e78a4e'
yellow = '#d8a657'
green = '#a9b665'
aqua = '#89b482'
blue = '#7daea3'
purple = '#d3869b'

[palettes.catppuccin_macchiato]
bg0 = "#181926"
bg1 = "#1e2030"
bg2 = "#24273a"
fg0 = "#cad3f5"
red = "#ed8796"
orange = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
aqua = "#8bd5ca"
blue = "#8aadf4"
purple = "#c6a0f6"

[env_var.STARSHIP_DISTRO]
format = '[$env_value](black)'
variable = "STARSHIP_DISTRO"
disabled = true

[line_break]
disabled = true

[hostname]
ssh_only = true
format = "[$hostname](bold fg:red) "
trim_at = "."
disabled = false

[character]
format = '$symbol '
success_symbol = '[➜](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = "[](bold fg:purple)"
disabled = false

[status]
format = "[$status$symbol]($style) "
pipestatus_format = "\\[$pipestatus\\] => [$symbol$common_meaning$signal_name$maybe_int]($style) "
symbol = ''
pipestatus_separator = '|'
map_symbol = false
pipestatus = true
disabled = false

[directory]
style = "bold fg:blue"
read_only_style = 'bold fg:red'
truncation_length = 1
truncation_symbol = ".../"
home_symbol = "~"
read_only = " "
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold fg:aqua"

[python]
symbol = " "
pyenv_version_name = true

[lua]
symbol = " "
format = '[via $symbol\(($version)\)]($style) '
style = 'bold fg:purple'

[shell]
disabled = true
zsh_indicator = 'ZSH'
style = "#5F5F5F"

[nodejs]
disabled = true

[package]
disabled = true

[ruby]
symbol = " "

[terraform]
format = "[$symbol$workspace](fg:purple)"
symbol = "󱁢 "

[golang]
symbol = "🐹 "
format = '[via $symbol\(($version)\)]($style) '
style = 'bold fg:orange'

[nix_shell]
disabled = false
impure_msg = '[impure shell](bold red)'
pure_msg = '[pure shell](bold green)'
unknown_msg = '[unknown shell](bold yellow)'
# format = 'via [$state](bold purple) '
format = ''
# format = 'via [$symbol $state (\($name\))](bold purple)'
